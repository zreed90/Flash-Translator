<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DeepSeek Layman's Terms Explainer</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .header img {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 28%, #ffffff 0%, #fef9c3 20%, #e2e8f0 70%, #64748b 100%);
      padding: 4px;
      box-shadow: inset -2px -3px 5px rgba(15, 23, 42, 0.4), 0 2px 8px rgba(250, 204, 21, 0.35);
    }
    h1 {
      font-size: 14px;
      margin: 0;
      font-weight: 700;
    }
    .sub {
      font-size: 11px;
      color: #facc15;
      margin-top: 1px;
    }
    .card {
      padding: 10px 12px;
      border-radius: 10px;
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 12px;
      margin-bottom: 10px;
      line-height: 1.45;
    }
    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .status-online { background: rgba(74, 222, 128, 0.2); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.4); }
    .status-direct { background: rgba(250, 204, 21, 0.2); color: #facc15; border: 1px solid rgba(250, 204, 21, 0.4); }
    label {
      display: block;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 3px;
      font-weight: 600;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      background: #0b1120;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 6px 9px;
      border-radius: 6px;
      font-size: 11px;
      margin-bottom: 8px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #facc15;
    }
    .btn {
      width: 100%;
      background: #facc15;
      color: #0f172a;
      border: none;
      padding: 7px;
      border-radius: 7px;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn:hover { background: #fde047; }
    .guide-box {
      font-size: 11px;
      color: #cbd5e1;
      padding: 8px 10px;
      background: rgba(30, 41, 59, 0.5);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
